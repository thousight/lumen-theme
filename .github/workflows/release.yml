name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  CI: true
  VSCODE_UI_VERSION: 1.109.4
  VSCODE_COMPAT_VERSION: 1.80.0

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Require the verified release history
        run: git merge-base --is-ancestor v0.2.1 HEAD
      - run: npm run lint:release-commits
      - name: Allow Electron sandbox on the disposable runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Release deterministically
        run: xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' npm run release
      - name: Retain prepared release files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-files-${{ github.run_id }}
          path: |
            dist/lumen-themes.vsix
            dist/lumen-themes.vsix.sha256
          if-no-files-found: ignore
