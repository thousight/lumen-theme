name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  CI: true
  VSCODE_UI_VERSION: 1.109.4
  VSCODE_COMPAT_VERSION: 1.80.0

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Require the tested main commit
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$TESTED_SHA"
      - name: Require the verified release baseline
        run: git merge-base --is-ancestor v0.2.1 HEAD
      - run: npm run lint:release-commits
      - name: Allow Electron sandbox on the disposable runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Release deterministically
        run: xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' npm run release
      - name: Retain prepared release files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-files-${{ github.event.workflow_run.id }}
          path: |
            dist/lumen-theme.vsix
            dist/lumen-theme.vsix.sha256
          if-no-files-found: ignore
